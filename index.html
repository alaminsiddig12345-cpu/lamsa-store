<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر لمسة</title>
<style>
body{margin:0;font-family:Tahoma;background:#fff5f7;text-align:center}
.header{background:#7a123d;color:#fff;padding:35px 15px}
.header h1{margin:0;font-size:30px}
.box{background:#fff;margin:15px auto;max-width:420px;padding:20px;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.price{color:#b91c5c;font-weight:900;font-size:22px;margin:10px 0}
.btn{display:block;background:#25D366;color:#fff;padding:15px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:17px}
.btn2{background:#7a123d}
</style>
</head>
<body>
<div class="header">
<h1>متجر لمسة 🌸</h1>
<p>عطور سودانية أصلية - أمدرمان</p>
</div>

<div class="box">
<h3>مسك الطهارة</h3>
<p>100 مل - الأصلي</p>
<div class="price">8,500 SDG</div>
<a class="btn" href="https://wa.me/249900000000">اطلب عبر واتساب</a>
</div>

<div class="box">
<h3>العود السوداني</h3>
<p>فاخر وثابت - 80 مل</p>
<div class="price">12,000 SDG</div>
<a class="btn" href="https://wa.me/249900000000">اطلب عبر واتساب</a>
</div>

<div class="box">
<h3>بوكس لمسة الكامل 🌸</h3>
<p>مسك + عود + بخور</p>
<div class="price">25,000 SDG</div>
<a class="btn btn2" href="https://wa.me/249900000000">اطلب البوكس الكامل</a>
</div>

<p style="color:#999;font-size:13px;padding:20px">© متجر لمسة 2026 - أمدرمان</p>
</body>
</html>
